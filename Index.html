
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Layout</title>

<style>

body {
    background-color: rgba(247, 241, 241, 0.993);
}

header {
    width: 100%;
    height: 20vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

header h1 {
    background: linear-gradient(360deg, red, blue);
    font-family: 'Franklin Gothic Medium';
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(4, 1fr);
    height: 100vh;
    gap: 15px;
    padding-left: 2%;
}

.container > div {
    border:none;
    background: linear-gradient(to bottom left, red, blue);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.container p {
    top: 50%;
    left: 50%;
    position: absolute;
    border: none;
    background-color: white;
    width: 30px;
    height: 30px;
    transform: translate(-50%, -50%) rotate(45deg);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 1.5s ease-in-out;
    z-index: 2;
}

.container p span {
    font-family: 'Franklin Gothic Medium';
    transform: rotate(-45deg);
}

.container div:hover p {
    transform: translate(-50%, -50%) rotate(45deg) scale(2);
}

.container div:hover {
    background: linear-gradient(to top left, rgb(86, 184, 57), rgb(0, 0, 0));
}


.box1 {
    grid-row: 1 / 3;
    grid-column: 2 / 4;
}

.box2 {
    grid-row: 3 / 5;
    grid-column: 3;
}

.box3 {
    grid-row: 1;
    grid-column: 4 / 6;
}

.box4 {
    grid-row: 2;
    grid-column: 4 / 6;
}

.box5 {
    grid-row: 1;
    grid-column: 1;
}

.box6 {
    grid-row: 2;
    grid-column: 1;
}

.box7 {
    grid-row: 3;
    grid-column: 1;
}

.box8 {
    grid-row: 4;
    grid-column: 1;
}

.box9 {
    grid-row: 3;
    grid-column: 2;
}

.box10 {
    grid-row: 4;
    grid-column: 2;
}

.box11 {
    grid-row: 3;
    grid-column: 4;
}

.box12 {
    grid-row: 3;
    grid-column: 5;
}

.box13 {
    grid-row: 4;
    grid-column: 5;
}

.box14 {
    grid-row: 4;
    grid-column: 4;
}


</style>
</head>

<body>

<header>
    <h1>GRID LAYOUT</h1>
</header>

<div class="container">

    <div class="box1"><p><span>1</span></p></div>
    <div class="box2"><p><span>2</span></p></div>
    <div class="box3"><p><span>3</span></p></div>
    <div class="box4"><p><span>4</span></p></div>
    <div class="box5"><p><span>5</span></p></div>
    <div class="box6"><p><span>6</span></p></div>
    <div class="box7"><p><span>7</span></p></div>
    <div class="box8"><p><span>8</span></p></div>
    <div class="box9"><p><span>9</span></p></div>
    <div class="box10"><p><span>10</span></p></div>
    <div class="box11"><p><span>11</span></p></div>
    <div class="box12"><p><span>12</span></p></div>
    <div class="box13"><p><span>13</span></p></div>
    <div class="box14"><p><span>14</span></p></div>

</div>

</body>
</html>
